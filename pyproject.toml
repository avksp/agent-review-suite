[build-system]
requires = ["setuptools==83.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-review-suite"
dynamic = ["version"]
description = "Provider-neutral review guidance and bounded v1 request and report validation"
readme = "README.md"
requires-python = ">=3.11,<3.16"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Agent Review Suite contributors"}]
keywords = ["agents", "review", "architecture", "security", "product-review", "evidence"]
classifiers = ["Development Status :: 3 - Alpha", "Intended Audience :: Developers", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Programming Language :: Python :: 3.14", "Programming Language :: Python :: 3.15", "Operating System :: OS Independent", "Typing :: Typed"]
dependencies = []

[project.urls]
Homepage = "https://github.com/avksp/agent-review-suite"
Repository = "https://github.com/avksp/agent-review-suite"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "agent_review_suite._version.__version__"}

[tool.setuptools.package-data]
agent_review_suite = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [".alk", "tasks", "work", "release", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src/agent_review_suite"]
strict = true

[tool.setuptools.data-files]
"share/agent-review-suite/schemas" = ["schemas/review-request.v1.schema.json", "schemas/review-report.v1.schema.json", "schemas/review-expectations.v1.schema.json"]
"share/agent-review-suite/." = ["LICENSE", "NOTICE", "README.md", "README.ru.md", "plugin.json"]
"share/agent-review-suite/.agents/plugins" = [".agents/plugins/marketplace.json"]
"share/agent-review-suite/.claude-plugin" = [".claude-plugin/marketplace.json", ".claude-plugin/plugin.json"]
"share/agent-review-suite/.codex-plugin" = [".codex-plugin/plugin.json"]
"share/agent-review-suite/adapters" = ["adapters/README.md", "adapters/README.ru.md"]
